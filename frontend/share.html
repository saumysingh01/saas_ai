<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Market Report — MarketMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--bg); }
    .share-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 5%; background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .share-nav-logo { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
    .share-nav-logo span { color: var(--text); }
    .share-container { max-width: 820px; margin: 2.5rem auto; padding: 0 1.5rem 4rem; }
    .share-header {
      background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
      color: #fff; border-radius: var(--radius); padding: 2rem; margin-bottom: 1.5rem;
    }
    .share-header .label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; opacity: .8; }
    .share-header h1 { font-size: 1.5rem; font-weight: 800; margin: .4rem 0 .25rem; }
    .share-header .meta { font-size: .85rem; opacity: .8; }
    .share-body-card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 2rem; }
    .share-footer {
      text-align: center; margin-top: 2rem; padding: 1.5rem;
      background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border);
    }
    .share-footer p { font-size: .9rem; color: var(--text-muted); margin-bottom: .75rem; }
    .loading {
      text-align: center; padding: 4rem; color: var(--text-muted);
    }
    .error-state {
      text-align: center; padding: 4rem;
    }
    .error-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .error-state h2 { color: var(--danger); margin-bottom: .5rem; }
    .error-state p  { color: var(--text-muted); font-size: .9rem; }
  </style>
</head>
<body>

<!-- ── Nav ── -->
<nav class="share-nav">
  <a href="landing.html" class="share-nav-logo">Market<span>Mind</span> AI</a>
  <a href="landing.html" class="btn btn-primary btn-sm">Get Free Access →</a>
</nav>

<div class="share-container">

  <!-- Loading state -->
  <div id="loading-state" class="loading">
    <div class="spinner" style="width:32px;height:32px;border-width:3px;margin:0 auto 1rem"></div>
    <p>Loading shared report…</p>
  </div>

  <!-- Error state -->
  <div id="error-state" class="error-state hidden">
    <div class="icon">🔗</div>
    <h2>Link not found</h2>
    <p>This share link may have expired or been removed.</p>
    <a href="landing.html" class="btn btn-primary" style="margin-top:1.5rem">Create your own report →</a>
  </div>

  <!-- Report content -->
  <div id="report-content" class="hidden">
    <div class="share-header">
      <div class="label">Shared Market Analysis Report</div>
      <h1 id="report-title"></h1>
      <div class="meta" id="report-meta"></div>
    </div>

    <div class="share-body-card">
      <div id="report-body" class="report-body"></div>
    </div>

    <div class="share-footer">
      <p>This report was generated by <strong>MarketMind AI</strong> — instant market intelligence for founders.</p>
      <a href="landing.html" class="btn btn-primary">Get 5 Free Reports / Month →</a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js"></script>
<script>
  const API_BASE = "http://localhost:8000/api/v1";

  async function loadSharedReport() {
    const params  = new URLSearchParams(window.location.search);
    const token   = params.get("token");

    if (!token) {
      showError();
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/share/${encodeURIComponent(token)}`);
      if (!res.ok) { showError(); return; }

      const data = await res.json();

      document.title = `${data.market_topic} — MarketMind AI`;
      document.getElementById("report-title").textContent = data.market_topic;
      document.getElementById("report-meta").textContent =
        "Generated on " + new Date(data.created_at).toLocaleDateString("en-IN", {
          day: "numeric", month: "long", year: "numeric"
        });
      document.getElementById("report-body").innerHTML =
        DOMPurify.sanitize(marked.parse(data.generated_report));

      document.getElementById("loading-state").classList.add("hidden");
      document.getElementById("report-content").classList.remove("hidden");

    } catch (e) {
      showError();
    }
  }

  function showError() {
    document.getElementById("loading-state").classList.add("hidden");
    document.getElementById("error-state").classList.remove("hidden");
  }

  loadSharedReport();
</script>
</body>
</html>
